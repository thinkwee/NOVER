# 4-node 32-GPU configuration example
defaults:
  - config

project:
  suffix: "large_scale_exp"
  wandb_project: "nover_large_scale"
  save_base_path: "/shared/models"

dataset:
  name: "your_large_dataset"
  hf_home: "/shared/huggingface"

model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  name_vllm: "Qwen/Qwen2.5-7B-Instruct"

training:
  batch_size: 2  # Small per-GPU batch size for large scale
  gradient_accumulation_steps: 2
  save_steps: 50
  logging_steps: 10
  max_completion_length: 1024

# 4-node distributed training
distributed:
  num_nodes: 4
  node_rank: 0  # Change this for each node: 0, 1, 2, 3
  master_addr: "10.0.0.1"
  master_port: "29500"
  nccl_socket_ifname: "ib0"  # InfiniBand interface
  backend: "nccl"

gpu:
  training:
    gpu_ids: "0,1,2,3,4,5,6,7"  # All 8 GPUs for training
    num_gpus: 8
    main_process_port: 28890
  vllm:
    gpu_ids: "0,1"  # Use separate cluster/node for vLLM
    tensor_parallel_size: 2

vllm:
  port: 8087
  gpu_memory_utilization: 0.9
  host: "10.0.0.10"  # Dedicated vLLM server node